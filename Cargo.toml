[workspace]
resolver = "2"
members = [
    "crates/engine-core",
    "crates/engine-types",
    "crates/engine-scene",
    "crates/engine-assets",
    "crates/engine-render",
    "crates/engine-physics",
    "crates/engine-anim",
    "crates/engine-audio",
    "crates/engine-script",
    "crates/engine-cli",
    "crates/engine-mcp",
    "games/sandbox",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
hecs = "0.10"
glam = { version = "0.33", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rand = "0.8"
rand_chacha = "0.3"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sha2 = "0.10"
gltf = "1"
bincode = "1"
assert_cmd = "2"
predicates = "3"
mlua = { version = "0.12", features = ["lua54", "vendored", "serde"] }
notify = "8"
notify-debouncer-mini = "0.7"
rmcp = "3.2"
tokio = "1"
rapier3d = "0.35"
winit = "0.30"
kira = { version = "0.12", default-features = false, features = ["cpal", "wav", "ogg", "vorbis", "pcm"] }
hound = "3"
lru = "0.18.3"

# Local dev-loop speed: full debug info's cost (link time, target dir size)
# outweighs its value here — this codebase surfaces failures as structured
# JSON errors (see docs/decisions/0017-system-error-channel.md), not stack
# traces, so line-tables-only panics/backtraces are enough. `cargo test`
# inherits `[profile.dev]` unless `[profile.test]` overrides it, so this
# covers test binaries too. Dependencies (wgpu, image, gltf, rapier3d, ...)
# get opt-level 1 so render/mesh/physics-heavy tests run faster once
# compiled, while this workspace's own crates stay at opt-level 0 for fast
# incremental compiles during iteration.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
