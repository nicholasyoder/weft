[workspace]
resolver = "2"
members = [
    "crates/engine-core",
    "crates/engine-scene",
    "crates/engine-render",
    "crates/engine-cli",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
hecs = "0.10"
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rand = "0.8"
rand_chacha = "0.3"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
assert_cmd = "2"
predicates = "3"
