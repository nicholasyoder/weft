[workspace]
resolver = "2"
members = [
    "crates/engine-core",
    "crates/engine-cli",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
hecs = "0.10"
glam = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_chacha = "0.3"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
assert_cmd = "2"
predicates = "3"
