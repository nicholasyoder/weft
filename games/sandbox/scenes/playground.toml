# Weft's one real game: a physics playground, now a 34x34 walled arena
# (up from the original 20x20 — see gpu.rs's SHADOW_ORTHO_HALF_EXTENT/
# SHADOW_FAR, bumped to match) split by an interior partition into a large
# main area and a smaller gated back room. WASD moves a humanoid capsule
# player (a real kinematic character controller, see
# games/sandbox/src/player_control.rs, physics-substrate-plan.md Phase 7 —
# Space jumps), camera-relative to a mouse-look third-person orbit camera
# (games/sandbox/src/camera_look.rs + camera_follow.rs). See ADR-0010 and
# ROADMAP.md Phase 8.
#
# Five gold pickups are scripted (games/sandbox/scripts/pickup.lua, see
# ADR-0013 and Phase 6): walk up to one (a real rapier sensor overlap) and
# hold E to collect it. Two of the five sit in the back room, so the gate
# actually gates something. A HUD counter ("Pickups: N/5", see ADR-0014)
# shows progress on screen.
#
# The "gate" blocking the back room is opened by the "lever" entity
# (games/sandbox/scripts/lever.lua) — a second, deliberately different
# interaction from the pickups: instead of engine.overlapping (proximity),
# holding E near the lever casts a real engine.raycast from the lever
# toward the player and only opens the gate (finds it by its Gate marker
# component, games/sandbox/src/gate.rs, and despawns it) when that ray
# reports the player as the unobstructed hit — a real line-of-sight check,
# not just a distance check. This is games/sandbox's first live use of
# engine.raycast; previously only engine-physics's own unit tests exercised
# it. The lever is a one-shot switch, same "collected == gone" idiom
# pickup.lua already uses.
#
# Two kinematic "moving_platform"/"moving_platform_2" entities oscillate on
# a sine wave along different axes (see games/sandbox/src/
# moving_platform.rs, physics-substrate-plan.md Phase 5) — proof the
# mechanism generalizes beyond one hardcoded instance, not just a single
# fixed demo.
#
# Every obstacle now authors explicit Material.roughness/metallic (ADR-0019
# Phase 1) instead of relying on the matte default — the "steel" pillars
# actually read as metallic under the real Cook-Torrance BRDF, the wood
# crates as rough/non-metallic, and the gate as a low-roughness, mid-
# metallic warning-colored barrier. Two point Lights ("lamp_backroom",
# "lamp_platform" — ADR-0019 Phase 4) join the directional "sun", the first
# live use of point lights in games/sandbox; total lights (1 directional +
# 2 point = 3) stay under the fixed 4-light cap, and only "sun" casts a
# shadow, so RenderError::TooManyLights/MultipleShadowCasters never trip.
#
# System order matters: "camera_look" (mouse-look, updates the camera's
# yaw/pitch from this tick's mouse motion) must run before "player_control",
# so camera-relative WASD movement uses this tick's fresh yaw, not last
# tick's. "player_control" and both "moving_platform"/"moving_platform_2"
# must run before "physics" — they each stage a pending change (a kinematic
# target, via PhysicsState::move_character/set_character_rotation/
# set_kinematic_translation) on a rigid body that "physics" consumes when it
# steps the world. "camera_follow" (camera placement) must run after
# "physics" so it reads the player's post-physics position for this tick,
# not last tick's. Script dispatch (the pickups and the lever) is
# automatic — any scene with a Script component gets one, no [[system]]
# entry needed. "hud" runs last so it counts each tick's despawns with the
# least possible lag (still one tick behind script dispatch, which itself
# runs after every [[system]] here — see hud_system's doc comment). "audio"
# (ADR-0016) drains each tick's engine.play_sound calls from the previous
# tick's script dispatch — pickup.lua/lever.lua both fire one the same tick
# they despawn something, so a collect or a gate-open always has an
# audible confirmation. "animation" has no ordering dependency on anything
# else in this scene (it only reads/writes its own entity's
# Animator/JointPalette), so it's appended last.
#
# "rig" is a decorative, always-looping skinned+animated prop (the
# hand-built two-joint fixture from
# crates/engine-assets/tests/fixtures/skinned.gltf, per
# debt-cleanup-plan.md Phase 8 — no rigged asset-gen pipeline exists yet,
# see ADR-0015's "revisit when" note) and "ambience" is a looping background
# AudioSource — both exist purely to give animation/looping-audio real
# cross-subsystem coverage in a live game scene, not isolated crate fixtures.

[audio]
master = 1.0
music = 1.0
sfx = 1.0

