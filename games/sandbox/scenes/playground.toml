# The first Weft-built game: a physics playground. WASD moves a humanoid
# capsule player (a real kinematic character controller, see
# games/sandbox/src/player_control.rs, physics-substrate-plan.md Phase 7 —
# Space jumps), camera-relative to a mouse-look third-person orbit camera
# (games/sandbox/src/camera_look.rs + camera_follow.rs) around a walled
# arena with a fixed obstacle pillar. See ADR-0010 and ROADMAP.md Phase 8.
# Three gold pickups are scripted
# (games/sandbox/scripts/pickup.lua, see ADR-0013 and Phase 6): walk up to
# one (a real rapier sensor overlap) and hold E to collect it — the first
# content actually using Weft's scripting API in a real, live-playable game
# rather than a batch test fixture. A HUD counter ("Pickups: N/3", see
# ADR-0014) shows progress on screen — the first use of Weft's
# text-rendering/minimal-UI layer in a real game.
#
# A kinematic "moving_platform" entity oscillates on a sine wave (see
# games/sandbox/src/moving_platform.rs, physics-substrate-plan.md Phase 5) —
# the first live proof of a KinematicPositionBased body outside a unit test.
#
# System order matters: "camera_look" (mouse-look, updates the camera's
# yaw/pitch from this tick's mouse motion) must run before "player_control",
# so camera-relative WASD movement uses this tick's fresh yaw, not last
# tick's. "player_control" and "moving_platform" must both run before
# "physics" — they each stage a pending change (a kinematic target, via
# PhysicsState::move_character/set_character_rotation/
# set_kinematic_translation) on a rigid body that "physics" consumes when it
# steps the world. "camera_follow" (camera placement) must run after
# "physics" so it reads the player's post-physics position for this tick,
# not last tick's. Script dispatch (the pickups) is automatic —
# any scene with a Script component gets one, no [[system]] entry needed.
# "hud" runs last so it counts each tick's despawns with the least possible
# lag (still one tick behind script dispatch, which itself runs after every
# [[system]] here — see hud_system's doc comment). "audio" (ADR-0016) drains
# each tick's engine.play_sound calls from the previous tick's script
# dispatch — pickup.lua fires one the same tick it despawns a pickup, so a
# collect always has an audible confirmation. "animation" has no ordering
# dependency on anything else in this scene (it only reads/writes its own
# entity's Animator/JointPalette), so it's appended last.
#
# "rig" is a decorative, always-looping skinned+animated prop (the hand-built
# two-joint fixture from crates/engine-assets/tests/fixtures/skinned.gltf,
# per debt-cleanup-plan.md Phase 8 — no rigged asset-gen pipeline exists yet,
# see ADR-0015's "revisit when" note) and "ambience" is a looping background
# AudioSource — both exist purely to give animation/looping-audio real
# cross-subsystem coverage in a live game scene, not isolated crate fixtures.

