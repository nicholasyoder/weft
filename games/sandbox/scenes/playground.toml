# Second imported asset, generated by the same script as "pillar" above
# with --color/--bevel-width now exposed as parameters — proves the
# headless-Blender pattern generalizes to a small deterministic kit of
# variants instead of one fixed asset (the "prop kit" case ADR-0009 calls
