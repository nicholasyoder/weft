# The first Weft-built game: a physics playground. WASD rolls the red ball
# around a walled arena with a fixed obstacle pillar. See ADR-0010 and
# ROADMAP.md Phase 8. Three gold pickups are scripted (games/sandbox/
# scripts/pickup.lua, see ADR-0013): roll up to one and hold E to collect
# it — the first content actually using Weft's scripting API in a real,
# live-playable game rather than a batch test fixture. A HUD counter
# ("Pickups: N/3", see ADR-0014) shows progress on screen — the first use of
# Weft's text-rendering/minimal-UI layer in a real game.
#
# System order matters: "player_control" must run before "physics" — it sets
# a pending force on the ball's rigid body that "physics" consumes and clears
# every tick (see PhysicsState::apply_force's doc comment). "camera_follow"
# must run after "physics" so it reads the ball's post-physics position for
# this tick, not last tick's. Script dispatch (the pickups) is automatic —
# any scene with a Script component gets one, no [[system]] entry needed.
# "hud" runs last so it counts each tick's despawns with the least possible
# lag (still one tick behind script dispatch, which itself runs after every
# [[system]] here — see hud_system's doc comment). "audio" (ADR-0016) drains
# each tick's engine.play_sound calls from the previous tick's script
# dispatch — pickup.lua fires one the same tick it despawns a pickup, so a
# collect always has an audible confirmation.

