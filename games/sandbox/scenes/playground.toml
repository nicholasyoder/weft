# physics-substrate-plan.md Phase 7: a real kinematic character controller
# (PhysicsState::move_character) replaces the original force-driven rolling
# sphere — wall sliding, step handling, and ground snapping now come from
# rapier's own character-controller mechanism instead of raw per-tick
# forces + damping.
[entity.components.RigidBody]
body_type = "kinematic_position_based"
[entity.components.Collider]
shape = { kind = "capsule", half_height = 0.5, radius = 0.3 }
# A real imported humanoid mesh (tools/asset-gen/generate_humanoid.py),
# authored in world units matching the capsule collider above — no scale
# hack needed, unlike the old sphere-squashed-into-an-ellipsoid
# approximation this replaced.
