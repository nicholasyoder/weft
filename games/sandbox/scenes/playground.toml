[[entity]]
name = "player"
[entity.components.Transform]
position = [0.0, 2.0, 4.0]
[entity.components.RigidBody]
body_type = "dynamic"
# A rolling sphere loses very little speed to plain contact friction, so
# without damping the ball would coast at whatever speed a tap left it at
# until it hits a wall. This damping is what makes the ball actually slow
# down once WASD is released, instead of "shooting" to the nearest barrier.
linear_damping = 4.0
angular_damping = 4.0
[entity.components.Collider]
shape = { kind = "sphere", radius = 0.5 }
restitution = 0.1
friction = 0.6
[entity.components.MeshRef]
mesh = "sphere"
[entity.components.Material]
color = [0.85, 0.2, 0.2]
[entity.components.PlayerControl]
force = 12.0

[[entity]]
name = "camera"
[entity.components.Transform]
position = [0.0, 9.0, 12.0]
[entity.components.Camera]
target = [0.0, 0.5, 0.0]
[entity.components.CameraFollow]
offset = [0.0, 6.0, 8.0]

[[entity]]
name = "hud"
# Weft's text-rendering/minimal-UI layer (ADR-0014), first used for real
# here: content is overwritten every tick by hud_system, this is just the
# starting value. A custom imported font, not the engine's embedded
# fallback — proves `Text.font` works with a real developer-supplied font,
# not just the zero-config default (games/sandbox/assets-src/
# PressStart2P-Regular.ttf, OFL-licensed, imported via `engine import`).
[entity.components.Text]
content = "Pickups: 0/3"
x = 16.0
y = 16.0
size = 20.0
color = [1.0, 0.95, 0.4]
font = "034c77f1f05ec89421e4a63f0e3a4ca1ecf852cc6d2bf611f126f275728e017d"

[[system]]
name = "player_control"
[[system]]
name = "physics"
[[system]]
name = "camera_follow"
[[system]]
name = "hud"
[[system]]
name = "audio"
